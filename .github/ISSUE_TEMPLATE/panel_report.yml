name: Panel report
description: Tell us how the integration does with your panel.
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Panel hardware
      placeholder: Nest Learning Thermostat (2nd generation), EU base
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Panel firmware version
      description: Shown in the panel's Settings → About.
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Does it work?
      options:
        - Everything works
        - Partially (details below)
        - Not discovered / doesn't pair / doesn't work
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: >-
        What works and what doesn't (discovery, pairing, controls, sensors,
        notifications ...). Attaching the diagnostics helps: Settings → Devices &
        Services → Nesto Panel → ⋮ → Download diagnostics.
