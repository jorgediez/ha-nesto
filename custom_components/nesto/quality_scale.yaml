# Home Assistant's Integration Quality Scale, as a checklist for this integration.
# Hassfest only validates this file for core integrations; it is kept by hand.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: todo
    comment: The notification actions arrive with notifications.
  appropriate-polling:
    status: exempt
    comment: The panel pushes everything over one connection; nothing is polled.
  brands:
    status: todo
    comment: An original icon, nothing like Google's, before the first release.
  common-modules: todo
  config-flow:
    status: todo
    comment: Pairing with the code shown on the panel comes next.
  config-flow-test-coverage: todo
  dependency-transparency:
    status: exempt
    comment: >-
      No requirements: the protocol client is part of the integration, and its
      one library, cryptography, comes with Home Assistant core.
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers; presses arrive as event entities.
  entity-event-setup: todo
  entity-unique-id: todo
  has-entity-name: todo
  runtime-data: todo
  test-before-configure: todo
  test-before-setup: todo
  unique-config-entry:
    status: todo
    comment: The panel id, its Wi-Fi MAC address, will be the unique id.

  # Silver
  action-exceptions: todo
  config-entry-unloading: todo
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable: todo
  integration-owner: done
  log-when-unavailable: todo
  parallel-updates: todo
  reauthentication-flow:
    status: todo
    comment: Pairing again when someone chooses Forget on the panel.
  test-coverage: todo

  # Gold
  devices: todo
  diagnostics: todo
  discovery:
    status: todo
    comment: The panel announces _nesto._tcp over mDNS.
  discovery-update-info: todo
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry is one panel.
  entity-category: todo
  entity-device-class: todo
  entity-disabled-by-default: todo
  entity-translations: todo
  exception-translations: todo
  icon-translations: todo
  reconfiguration-flow: todo
  repair-issues:
    status: todo
    comment: A panel speaking a protocol version the integration doesn't.
  stale-devices:
    status: exempt
    comment: Each config entry is one panel.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The panel speaks its own TCP protocol, not HTTP.
  strict-typing: todo
