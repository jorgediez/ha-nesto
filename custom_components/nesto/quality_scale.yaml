# Home Assistant's Integration Quality Scale, as a checklist for this integration.
# Hassfest only validates this file for core integrations; it is kept by hand.
# https://developers.home-assistant.io/docs/core/integration-quality-scale/
rules:
  # Bronze
  action-setup:
    status: todo
    comment: The notification actions arrive with notifications.
  appropriate-polling:
    status: exempt
    comment: The panel pushes everything over one connection; nothing is polled.
  brands:
    status: done
    comment: >-
      An original icon in brand/, drawn by scripts/make_brand_images.py; nothing
      like Google's or Nest's logos.
  common-modules:
    status: done
    comment: The coordinator in coordinator.py, the base entity in entity.py.
  config-flow:
    status: done
    comment: Discovery or an address, then the code the panel shows.
  config-flow-test-coverage: done
  dependency-transparency:
    status: exempt
    comment: >-
      No requirements: the protocol client is part of the integration, and its
      one library, cryptography, comes with Home Assistant core.
  docs-actions: todo
  docs-conditions:
    status: exempt
    comment: The integration provides no conditions.
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  docs-triggers:
    status: exempt
    comment: The integration provides no triggers; presses arrive as event entities.
  entity-event-setup:
    status: exempt
    comment: Entities subscribe to nothing themselves; the coordinator handles pushes.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure:
    status: done
    comment: Pairing proves the panel is there and holds the same key.
  test-before-setup: done
  unique-config-entry:
    status: done
    comment: The panel id, its Wi-Fi MAC address.

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: done
    comment: Pairing again when the panel no longer accepts the key.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: The panel announces _nesto._tcp over mDNS.
  discovery-update-info: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: Each config entry is one panel.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: todo
  entity-translations: done
  exception-translations: done
  icon-translations: todo
  reconfiguration-flow: done
  repair-issues:
    status: done
    comment: A panel speaking a protocol version the integration doesn't.
  stale-devices:
    status: exempt
    comment: Each config entry is one panel.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The panel speaks its own TCP protocol, not HTTP.
  strict-typing: todo
